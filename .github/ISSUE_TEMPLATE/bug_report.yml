name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please fill out the form below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant configuration (facades, rules, covers). Use `cover_automatic.export_config` service to export.
      placeholder: |
        Facades: South (135-225)
        Covers: cover.living_room (facade: south)
        Rules: ...
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Relevant log output. Enable debug logging via Settings -> Devices & Services -> CoverAutomatic -> three-dot menu -> Enable debug logging, reproduce the issue, then disable it again to download the log."
      placeholder: Paste relevant log lines here
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: CoverAutomatic Version
      description: Which version are you using? (shown in the panel header and in HACS)
      placeholder: "1.57.2"
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant Version
      description: Which Home Assistant version are you running?
      placeholder: "2026.8.1"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation Method
      options:
        - HACS
        - Manual
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read the Troubleshooting section of the README
          required: true
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have enabled debug logging and checked the logs
          required: false
