name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: "uv.lock"

      - name: Install ruff
        run: uv sync --locked --only-group lint

      - name: Ruff check
        run: |
          source .venv/bin/activate
          ruff check custom_components/cover_automatic/ tests/ --output-format=github

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --locked --only-group test --python "$PYTHON_VERSION"

      - name: Syntax check
        run: |
          source .venv/bin/activate
          python -m py_compile custom_components/cover_automatic/*.py

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # home-assistant/actions publishes no tags; @master is the documented ref
      - name: Hassfest Validation
        uses: home-assistant/actions/hassfest@master
