name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Deps are pinned inline below, so key the uv cache on this workflow file
          cache-dependency-glob: ".github/workflows/ci.yml"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install ruff
        run: |
          uv venv
          uv pip install ruff==0.14.10

      - name: Ruff check
        run: |
          source .venv/bin/activate
          ruff check custom_components/cover_automatic/ tests/ --output-format=github

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Deps are pinned inline below, so key the uv cache on this workflow file
          cache-dependency-glob: ".github/workflows/ci.yml"

      - name: Set up Python
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install pytest==9.0.2 pytest-asyncio==1.3.0 homeassistant==2026.8.1

      - name: Syntax check
        run: |
          source .venv/bin/activate
          python -m py_compile custom_components/cover_automatic/*.py

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration
