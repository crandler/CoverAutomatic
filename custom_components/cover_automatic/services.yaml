pause:
  name: Pause automation
  description: Pause automation for a specific cover.
  fields:
    entity_id:
      name: Cover
      description: The cover entity to pause automation for.
      required: true
      selector:
        entity:
          domain: cover

resume:
  name: Resume automation
  description: Resume automation for a specific cover.
  fields:
    entity_id:
      name: Cover
      description: The cover entity to resume automation for.
      required: true
      selector:
        entity:
          domain: cover

pause_all:
  name: Pause all
  description: Pause automation for all managed covers.

resume_all:
  name: Resume all
  description: Resume automation for all managed covers.

set_scenario:
  name: Set scenario
  description: Set the active automation scenario. Use scenario IDs from your configuration.
  fields:
    scenario:
      name: Scenario
      description: The scenario ID to activate (e.g., everyday, summer, winter, or custom scenarios).
      required: true
      example: "everyday"
      selector:
        text:

export_config:
  name: Export configuration
  description: Export the current configuration to a YAML file.
  fields:
    path:
      name: File path
      description: Path to save the configuration file.
      default: /config/cover_automatic_backup.yaml
      selector:
        text:

import_config:
  name: Import configuration
  description: Import configuration from a YAML file.
  fields:
    path:
      name: File path
      description: Path to the configuration file to import.
      required: true
      selector:
        text:
