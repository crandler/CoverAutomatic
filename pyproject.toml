[project]
name = "cover-automatic"
# The integration version lives in custom_components/cover_automatic/manifest.json
dynamic = ["version"]
requires-python = ">=3.14.2"
# Runtime deps come from Home Assistant (manifest.json "requirements": [])
dependencies = []

[dependency-groups]
test = [
    "homeassistant==2026.9.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
lint = [
    "ruff==0.16.10",
]

[tool.uv]
package = false
default-groups = ["test", "lint"]
